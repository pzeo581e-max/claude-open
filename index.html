<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Claude Codeで開く</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; line-height: 1.7; color: #222; background: #fff; }
  a.button { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #c96442; color: #fff; text-decoration: none; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .error { color: #b00020; }
</style>
</head>
<body>
<h1>Claude Codeで開く</h1>
<p id="msg">Claudeアプリでチャットを開いています…</p>
<p id="manual" hidden>開かないときは、下のボタンを押してください。<br><a class="button" id="open" href="#">Claude Codeで開く</a></p>
<p id="hint" hidden>それでも開かないときは、次の文字をコピーして <code>Win + R</code> の欄に貼り、OKを押してください。<br><code id="raw"></code></p>
<script>
  // 中継ページ：?s=local_<UUID> を受け取り、claude://claude.ai/epitaxy/local_<UUID> を開くだけ。
  // ほかの値は受け付けない（どこへでも飛べるリンクとして悪用されないように、形を固定する）。
  (function () {
    var s = new URLSearchParams(location.search).get('s') || '';
    var ok = /^local_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s);
    if (!ok) {
      document.getElementById('msg').textContent = 'リンクの形が正しくありません（?s=local_… が必要です）。';
      document.getElementById('msg').className = 'error';
      return;
    }
    var target = 'claude://claude.ai/epitaxy/' + s;
    document.getElementById('open').href = target;
    document.getElementById('raw').textContent = target;
    document.getElementById('manual').hidden = false;
    document.getElementById('hint').hidden = false;
    location.href = target;
  })();
</script>
</body>
</html>
